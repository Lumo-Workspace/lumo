# LUM-735 — Lumo dogfoods its own external oracle: Semgrep + gitleaks upload
# SARIF to GitHub code scanning, and the PR security scan (stage A2) reads the
# resulting alerts back through the code-scanning API.
#
# NOTE: code scanning on a PRIVATE repository requires GitHub Advanced Security
# (Code security) to be enabled for the repo. Until it is, `upload-sarif`
# fails with 403 and Lumo's own PRs show "External scanner: not configured".
name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan (SARIF)
        run: >-
          semgrep scan
          --config p/owasp-top-ten
          --config p/typescript
          --config p/nodejs
          --sarif --output semgrep.sarif
          --metrics=off
          --error
        continue-on-error: true
      - name: Upload SARIF
        # 403 until GitHub Advanced Security is enabled on this private repo (see header)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan (SARIF)
        run: >-
          gitleaks detect
          --source .
          --report-format sarif
          --report-path gitleaks.sarif
          --exit-code 0
          --no-banner
      - name: Upload SARIF
        # 403 until GitHub Advanced Security is enabled on this private repo (see header)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
