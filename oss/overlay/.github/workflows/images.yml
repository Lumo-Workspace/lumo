# Prebuilt self-hosting images (LUM-1325): the app and the cron runner, for
# linux/amd64 and linux/arm64, pushed to GitHub Container Registry. The
# default docker-compose.yml pulls these, so a server needs no `next build`
# (which wants ~8 GB of memory).
#
#   tag vX.Y.Z      → :X.Y.Z and :latest (pre-release tags, vX.Y.Z-rc.N, skip :latest)
#   manual dispatch → :sha-<short sha>, for testing a commit
#
# Each architecture builds on its own native runner (no QEMU), then the
# publish job joins the two into one multi-arch tag.
name: Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/$owner/lumo" >> "$GITHUB_OUTPUT"
          echo "cron=ghcr.io/$owner/lumo-cron" >> "$GITHUB_OUTPUT"

      # NEXT_PUBLIC_* are only build-time fallbacks: the app reads them at
      # runtime (lib/config/public-config.ts), so one image serves any domain.
      - name: App image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.names.outputs.app }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            AUTH_PROVIDER=better-auth
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_PUSHER_KEY=lumo
            NEXT_PUBLIC_PUSHER_HOST=localhost
            NEXT_PUBLIC_PUSHER_PORT=6001
            NEXT_PUBLIC_PUSHER_USE_TLS=false
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}

      - name: Cron image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/self-host
          file: deploy/self-host/cron.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.names.outputs.cron }}:${{ github.sha }}-${{ matrix.arch }}

  publish:
    name: Publish multi-arch tags
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the architectures under the release tags
        env:
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$REF_TYPE" = tag ]; then
            version=${REF_NAME#v}
            tags="$version"
            case "$version" in *-*) ;; *) tags="$tags latest" ;; esac
          else
            tags="sha-$(printf '%s' "$SHA" | cut -c1-12)"
          fi
          for image in lumo lumo-cron; do
            repo="ghcr.io/$owner/$image"
            args=""
            for t in $tags; do args="$args -t $repo:$t"; done
            # shellcheck disable=SC2086
            docker buildx imagetools create $args "$repo:$SHA-amd64" "$repo:$SHA-arm64"
            echo "Published $repo: $tags"
          done
