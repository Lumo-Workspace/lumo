# osv-scanner config, read by Lumo's managed PR scan (`osv-scanner scan source -r .`)
# for the lockfile in this directory (package-lock.json). It does not apply to child
# directories. Each entry expires on its ignoreUntil date so the advisory shows up in
# scans again and gets re-checked. LUM-935.
#
# An id here also suppresses its aliases (osv-scanner docs, configuration.md), so the
# GHSA id covers the CVE id the scanner reports.

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp" # alias CVE-2026-93748, http-cache-semantics
ignoreUntil = 2027-01-05
reason = """
No patched version as of 2026-10-05 (advisory lists every version through 4.2.0 as affected). \
The maintainer disputes the report as RFC 9111-conformant behaviour \
(https://github.com/kornelski/http-cache-semantics/issues/56, closed; \
https://github.com/github/advisory-database/issues/10139 open). \
Only path: workflow -> @workflow/nest (NestJS adapter) -> peer @swc/cli -> @xhmikosr/bin-wrapper \
-> @xhmikosr/downloader -> got -> cacheable-request -> http-cache-semantics, used to download \
swc binaries. Lumo does not use NestJS or @swc/cli, so no Lumo runtime code reaches it."""

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm" # alias CVE-2026-93687, braces
ignoreUntil = 2027-01-05
reason = """
No patched version as of 2026-10-05 (advisory lists every version through 3.0.3 as affected; \
3.0.3 is the latest release). The maintainer disputes the report \
(https://github.com/micromatch/braces/issues/70). \
Dev-only: braces <- micromatch <- fast-glob <- @next/eslint-plugin-next (eslint-config-next) \
and <- shadcn / ts-morph, all devDependencies; it expands repository glob patterns at lint/CLI \
time, never untrusted input, and is not in the production runtime."""

[[IgnoredVulns]]
id = "GHSA-rj75-hqrm-r3gf" # alias CVE-2026-104844, postcss-selector-parser
ignoreUntil = 2027-01-05
reason = """
Fixed only in 7.1.6 (no 6.x fix). The affected copy is postcss-selector-parser 6.0.10, \
exact-pinned by @tailwindcss/typography (0.5.19 here; latest 0.5.20 still pins 6.0.10), \
so the fix needs a major-version override inside a Tailwind plugin. The other copy \
(7.1.6, via shadcn, dev) is already fixed. The advisory itself says only parsing of \
untrusted selectors in a request path is exposed; build-time use on trusted sources is not. \
@tailwindcss/typography is loaded only by Tailwind at build time (@plugin in \
app/globals.css) on Lumo's own CSS; no Lumo runtime code imports it."""

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7" # alias CVE-2026-103923, katex
ignoreUntil = 2027-01-05
reason = """
Fixed only in 0.18.2; no 0.16.x fix. katex 0.16.47 comes only via mermaid (^0.16.47, still \
the range in mermaid 12.1.0, the latest release). Taking the fix needs an override outside \
mermaid's declared range across two breaking katex releases (0.17.0 internal API, 0.18.0 \
prefixed CSS classes that mermaid's math output styling may rely on). The advisory needs \
Object.prototype to be polluted already; mermaid calls katex with its own options object \
and Lumo renders diagrams client-side with securityLevel 'strict' (lib/editor/mermaid-render.ts). \
Re-check when mermaid moves to katex >= 0.18.2."""

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c" # alias CVE-2026-97058, sprintf-js
ignoreUntil = 2027-01-05
reason = """
No patched version as of 2026-10-05 (every version through 1.1.3, the latest, is affected; \
https://github.com/alexei/sprintf.js/issues/237 open). Dev-only: sprintf-js 1.0.3 <- argparse 1.0.10 \
<- js-yaml 3 <- @istanbuljs/load-nyc-config <- babel-plugin-istanbul <- @jest/transform <- jest. \
It formats argparse's own fixed strings during test runs; no attacker-controlled format string \
and not in the production runtime."""
