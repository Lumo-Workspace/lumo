# Lumo — one-command self-hosting (LUM-1028, LUM-1325, LUM-1332).
#
#   scripts/self-host/setup.sh --url https://lumo.example.com [--with all]
#   docker compose up -d                    # pulls the prebuilt images
#   docker compose --profile caddy up -d    # …plus HTTPS on that domain
#
# This file is the minimal stack: Postgres, the app (files on a local volume)
# and the scheduler. Redis, MinIO and realtime (Soketi) are overlay files in
# deploy/self-host/compose.<name>.yml; setup.sh --with lists them in
# COMPOSE_FILE in .env, which `docker compose` reads by itself.
#
# `docker compose up -d --build` builds the images from this checkout instead
# (needs ~8 GB of memory for Docker).
#
# Full guide: docs/self-hosting/README.md. Values come from `.env` (read by
# compose for ${...} below and passed to the app via env_file). The service
# wiring (database, storage, workflows) is fixed here and overrides whatever
# `.env` says for those variables.

# Prebuilt images come from the public repository's Images workflow; pin a
# release with LUMO_IMAGE=ghcr.io/lumo-workspace/lumo:<version> (and
# LUMO_CRON_IMAGE). Compose pulls the image and builds it only when the pull
# fails or `--build` is passed.
x-app-build: &app-build # Built once (by `app`); `migrate` runs the same image.
  image: ${LUMO_IMAGE:-ghcr.io/lumo-workspace/lumo:latest}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      # Better Auth (LUM-1043). Must match the
      # runtime AUTH_PROVIDER below — static pages bake it in at build time.
      # The NEXT_PUBLIC_* args are only fallbacks: the app reads the runtime
      # values below (LUM-1325), so changing them needs no rebuild.
      AUTH_PROVIDER: better-auth
      # Node heap for `next build`; lower it on a builder with < 8 GB.
      BUILD_MAX_OLD_SPACE_SIZE: ${BUILD_MAX_OLD_SPACE_SIZE:-6144}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_PUSHER_KEY: ${SOKETI_APP_KEY:-lumo}
      NEXT_PUBLIC_PUSHER_HOST: ${SOKETI_PUBLIC_HOST:-localhost}
      NEXT_PUBLIC_PUSHER_PORT: ${SOKETI_PUBLIC_PORT:-6001}
      NEXT_PUBLIC_PUSHER_USE_TLS: ${SOKETI_PUBLIC_TLS:-false}

x-app-env: &app-env
  env_file: [.env]
  environment:
    # Postgres (pgvector). The container has no TLS, so sslmode=disable
    # (lib/db/prisma.ts otherwise insists on a verified TLS connection).
    DATABASE_URL: postgresql://lumo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lumo?sslmode=disable
    DATABASE_URL_UNPOOLED: postgresql://lumo:${POSTGRES_PASSWORD}@postgres:5432/lumo?sslmode=disable
    # Durable workflows on the Postgres World (docs/self-hosting/workflow.md).
    # Direct connection; WORKFLOW_SECRET must be URL-safe (openssl rand -hex 32).
    WORKFLOW_TARGET_WORLD: '@workflow/world-postgres'
    WORKFLOW_POSTGRES_URL: postgres://lumo:${POSTGRES_PASSWORD}@postgres:5432/lumo?sslmode=disable
    WORKFLOW_SECRET: ${WORKFLOW_SECRET:?set WORKFLOW_SECRET in .env}
    WORKFLOW_LOCAL_BASE_URL: http://workflow:${WORKFLOW_SECRET}@localhost:3000
    # world-postgres 5.x defaults to 50 concurrent jobs, above its default
    # 10-connection pg pool; pin the 4.x value (docs/self-hosting/workflow.md).
    WORKFLOW_POSTGRES_WORKER_CONCURRENCY: '10'
    PORT: '3000'
    CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    # Sign-in with Better Auth: accounts and sessions in this Postgres
    # (docs/self-hosting/README.md#sign-in). The secret needs >= 32 chars.
    AUTH_PROVIDER: better-auth
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -hex 32)}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${NEXT_PUBLIC_APP_URL:-http://localhost:3000}}
    # Files on the blob-data volume. The minio overlay switches to S3; for
    # your own S3 set BLOB_STORAGE=s3 and S3_* in .env.
    BLOB_STORAGE: ${BLOB_STORAGE:-disk}
    LOCAL_BLOB_DIR: /var/lib/lumo/blobs
    # This deployment's public URL, read at runtime (LUM-1325) and served to
    # browsers by /api/public-config. Links that leave the app (CLI output,
    # GitHub comments) use LUMO_PUBLIC_URL, which otherwise points at the
    # hosted service.
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    LUMO_PUBLIC_URL: ${LUMO_PUBLIC_URL:-${NEXT_PUBLIC_APP_URL:-http://localhost:3000}}

services:
  postgres:
    # Lumo's migrations CREATE EXTENSION vector: plain postgres images fail.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lumo
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lumo -d lumo']
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: schema migrations, then the workflow World's own schemas.
  # Runs on every `up`; both steps are idempotent.
  migrate:
    <<: *app-env
    image: ${LUMO_IMAGE:-ghcr.io/lumo-workspace/lumo:latest}
    # Refuses to run when .env still holds MinIO's password but the minio
    # overlay is not loaded: the app would store files on disk and could no
    # longer read the ones in MinIO (scripts/self-host/setup.sh fixes it).
    command:
      - sh
      - -c
      - |
        if [ "$$BLOB_STORAGE" = disk ] && [ -n "$${MINIO_ROOT_PASSWORD:-}" ]; then
          echo 'MINIO_ROOT_PASSWORD is set but MinIO is not loaded: run scripts/self-host/setup.sh (docs/self-hosting/README.md#upgrading)' >&2
          exit 1
        fi
        npx prisma migrate deploy && npm run workflow:bootstrap
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  app:
    <<: [*app-build, *app-env]
    restart: unless-stopped
    ports: ['${LUMO_PORT:-3000}:3000']
    volumes: [blob-data:/var/lib/lumo/blobs]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/signin').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Scheduled jobs (docs/self-hosting/cron.md): supercronic runs
  # deploy/self-host/crontab, each line calling the app with CRON_SECRET.
  cron:
    image: ${LUMO_CRON_IMAGE:-ghcr.io/lumo-workspace/lumo-cron:latest}
    build:
      context: deploy/self-host
      dockerfile: cron.Dockerfile
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      APP_URL: http://app:3000
      TZ: UTC
      LUMO_CRON_DISABLED: ${LUMO_CRON_DISABLED:-}
    depends_on:
      app: { condition: service_healthy }

  # Optional HTTPS front door (LUM-1325): `docker compose --profile caddy up -d`.
  # Serves LUMO_DOMAIN with an automatic Let's Encrypt certificate (ports 80
  # and 443 must be reachable), proxying /app/ to Soketi (realtime overlay)
  # and the rest to the app — one origin, one port. setup.sh --url sets it up.
  caddy:
    image: caddy:2.10-alpine
    profiles: [caddy]
    restart: unless-stopped
    environment:
      LUMO_DOMAIN: ${LUMO_DOMAIN:-localhost}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deploy/self-host/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }

  # Dev only: catches outgoing mail (sign-up verification, invites — an
  # invitee must verify their email before accepting). Set
  # SMTP_URL=smtp://mailpit:1025 in .env, `docker compose --profile mail up -d`,
  # then read the mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    profiles: [mail]
    ports: ['8025:8025']

volumes:
  postgres-data:
  blob-data:
  caddy-data:
  caddy-config:
