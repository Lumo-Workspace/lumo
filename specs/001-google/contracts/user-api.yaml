openapi: 3.0.3
info:
  title: User Profile and Data Management API
  description: |
    API contract for user profile management, account settings, and GDPR compliance operations.
    Includes data export, deletion, and account management endpoints.
  version: 1.0.0
  contact:
    name: Lumo AI Team
  license:
    name: ISC

servers:
  - url: https://app.lumoai.com
    description: Production server
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Profile
    description: User profile management
  - name: Privacy
    description: GDPR compliance and data privacy
  - name: Settings
    description: Account settings and preferences

paths:
  /api/user/profile:
    get:
      summary: Get user profile
      description: |
        Retrieves the authenticated user's profile information including linked accounts.
      operationId: getUserProfile
      tags:
        - Profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: User profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: clu123456789
                name: John Doe
                email: john@example.com
                emailVerified: '2025-01-27T09:00:00.000Z'
                image: https://lh3.googleusercontent.com/a/...
                createdAt: '2025-01-27T09:00:00.000Z'
                updatedAt: '2025-01-27T10:30:00.000Z'
                linkedAccounts:
                  - provider: google
                    providerAccountId: '1234567890'
                    linkedAt: '2025-01-27T09:00:00.000Z'
                    lastUsedAt: '2025-01-27T10:30:00.000Z'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update user profile
      description: |
        Updates user profile information. Email cannot be changed (immutable).
      operationId: updateUserProfile
      tags:
        - Profile
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: John Smith
                image:
                  type: string
                  format: uri
                  nullable: true
                  example: https://example.com/avatar.jpg
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: validation_error
                message: Name must be between 1 and 255 characters
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user/export:
    get:
      summary: Export user data
      description: |
        Exports all user data in JSON format for GDPR compliance (SR-010).
        Includes user profile, linked accounts, and session history (excluding sensitive tokens).
      operationId: exportUserData
      tags:
        - Privacy
      security:
        - sessionCookie: []
      responses:
        '200':
          description: User data export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataExport'
              example:
                exportDate: '2025-01-27T12:00:00.000Z'
                user:
                  id: clu123456789
                  name: John Doe
                  email: john@example.com
                  emailVerified: '2025-01-27T09:00:00.000Z'
                  image: https://lh3.googleusercontent.com/a/...
                  createdAt: '2025-01-27T09:00:00.000Z'
                  updatedAt: '2025-01-27T10:30:00.000Z'
                accounts:
                  - provider: google
                    providerAccountId: '1234567890'
                    linkedAt: '2025-01-27T09:00:00.000Z'
                    lastUsedAt: '2025-01-27T10:30:00.000Z'
                    scope: openid email profile
                sessions:
                  - createdAt: '2025-01-27T10:00:00.000Z'
                    expires: '2025-01-28T10:00:00.000Z'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user/delete:
    delete:
      summary: Delete user account
      description: |
        Permanently deletes user account and all associated data (SR-011).
        Requires re-authentication for security. Cannot be undone.
      operationId: deleteUserAccount
      tags:
        - Privacy
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmation
              properties:
                confirmation:
                  type: string
                  description: User must type "DELETE" to confirm
                  enum:
                    - DELETE
                  example: DELETE
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Your account has been permanently deleted
        '400':
          description: Invalid confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_confirmation
                message: You must type DELETE to confirm account deletion
        '401':
          description: Not authenticated or re-authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user/sessions:
    get:
      summary: List active sessions
      description: |
        Lists all active sessions for the authenticated user.
        Supports concurrent session management (SR-015).
      operationId: listSessions
      tags:
        - Settings
      security:
        - sessionCookie: []
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionInfo'
                    maxItems: 3
              example:
                sessions:
                  - id: ses_abc123
                    createdAt: '2025-01-27T10:00:00.000Z'
                    expires: '2025-01-28T10:00:00.000Z'
                    device: Chrome on macOS
                    ipAddress: 192.168.1.xxx
                    current: true
                  - id: ses_def456
                    createdAt: '2025-01-26T08:00:00.000Z'
                    expires: '2025-01-27T08:00:00.000Z'
                    device: Safari on iPhone
                    ipAddress: 10.0.0.xxx
                    current: false
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Revoke all other sessions
      description: |
        Invalidates all sessions except the current one.
        Useful for security after suspected account compromise.
      operationId: revokeAllSessions
      tags:
        - Settings
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessions revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: All other sessions have been revoked
                  revokedCount:
                    type: integer
                    description: Number of sessions revoked
                    example: 2
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user/sessions/{sessionId}:
    delete:
      summary: Revoke specific session
      description: |
        Invalidates a specific session by ID. Cannot revoke current session (use signout instead).
      operationId: revokeSession
      tags:
        - Settings
      security:
        - sessionCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Session ID to revoke
          schema:
            type: string
            example: ses_abc123
      responses:
        '200':
          description: Session revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Session has been revoked
        '400':
          description: Cannot revoke current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: cannot_revoke_current
                message: You cannot revoke your current session. Use sign out instead.
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    UserProfile:
      type: object
      description: User profile with linked accounts
      required:
        - id
        - email
        - createdAt
        - updatedAt
        - linkedAccounts
      properties:
        id:
          type: string
          description: Unique user identifier
          example: clu123456789
        name:
          type: string
          nullable: true
          description: User's full name
          example: John Doe
        email:
          type: string
          format: email
          description: User's email address (immutable)
          example: john@example.com
        emailVerified:
          type: string
          format: date-time
          nullable: true
          description: Email verification timestamp
          example: '2025-01-27T09:00:00.000Z'
        image:
          type: string
          format: uri
          nullable: true
          description: Profile picture URL
          example: https://lh3.googleusercontent.com/a/...
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
          example: '2025-01-27T09:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: Last profile update timestamp
          example: '2025-01-27T10:30:00.000Z'
        linkedAccounts:
          type: array
          description: OAuth accounts linked to this user
          items:
            $ref: '#/components/schemas/LinkedAccount'

    LinkedAccount:
      type: object
      description: OAuth account linked to user
      required:
        - provider
        - providerAccountId
        - linkedAt
        - lastUsedAt
      properties:
        provider:
          type: string
          description: OAuth provider name
          example: google
        providerAccountId:
          type: string
          description: Provider-specific user ID
          example: '1234567890'
        linkedAt:
          type: string
          format: date-time
          description: When account was linked
          example: '2025-01-27T09:00:00.000Z'
        lastUsedAt:
          type: string
          format: date-time
          description: Last authentication with this account
          example: '2025-01-27T10:30:00.000Z'
        scope:
          type: string
          description: Granted OAuth scopes
          example: openid email profile

    UserDataExport:
      type: object
      description: Complete user data export for GDPR compliance
      required:
        - exportDate
        - user
        - accounts
        - sessions
      properties:
        exportDate:
          type: string
          format: date-time
          description: When this export was generated
          example: '2025-01-27T12:00:00.000Z'
        user:
          type: object
          description: User profile data
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
            email:
              type: string
            emailVerified:
              type: string
              format: date-time
              nullable: true
            image:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        accounts:
          type: array
          description: Linked OAuth accounts (tokens excluded for security)
          items:
            type: object
            properties:
              provider:
                type: string
              providerAccountId:
                type: string
              linkedAt:
                type: string
                format: date-time
              lastUsedAt:
                type: string
                format: date-time
              scope:
                type: string
        sessions:
          type: array
          description: Session history
          items:
            type: object
            properties:
              createdAt:
                type: string
                format: date-time
              expires:
                type: string
                format: date-time

    SessionInfo:
      type: object
      description: Active session information
      required:
        - id
        - createdAt
        - expires
        - device
        - ipAddress
        - current
      properties:
        id:
          type: string
          description: Session identifier
          example: ses_abc123
        createdAt:
          type: string
          format: date-time
          description: Session creation timestamp
          example: '2025-01-27T10:00:00.000Z'
        expires:
          type: string
          format: date-time
          description: Session expiration timestamp
          example: '2025-01-28T10:00:00.000Z'
        device:
          type: string
          description: Device/browser information
          example: Chrome on macOS
        ipAddress:
          type: string
          description: Client IP address (last octet anonymized)
          example: 192.168.1.xxx
        current:
          type: boolean
          description: Whether this is the current session
          example: true

    Error:
      type: object
      description: Error response
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code (machine-readable)
          example: validation_error
        message:
          type: string
          description: User-friendly error message
          example: Invalid request data
        details:
          type: object
          description: Additional error context (optional)
          additionalProperties: true

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-next-auth.session-token
      description: HTTP-only session cookie

security:
  - sessionCookie: []

x-gdpr-compliance:
  right-to-access:
    endpoint: GET /api/user/export
    format: JSON
    description: Users can export all their personal data
  right-to-erasure:
    endpoint: DELETE /api/user/delete
    description: Users can permanently delete their account and all data
    confirmation-required: true
  data-retention:
    active-sessions: 24 hours
    inactive-tokens: 30 days
    audit-logs: 90 days

x-security-requirements:
  authentication:
    description: All endpoints require active session
    implementation: NextAuth.js session validation
  rate-limiting:
    description: API endpoints rate limited per user
    implementation: 100 requests per minute per user
  data-minimization:
    description: Only necessary data stored and returned
    implementation: Profile limited to name, email, image
  ip-anonymization:
    description: IP addresses anonymized in logs and responses
    implementation: Last octet replaced with 'xxx'
