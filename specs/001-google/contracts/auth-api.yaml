openapi: 3.0.3
info:
  title: Google OAuth Authentication API
  description: API endpoints for Google OAuth login and account management
  version: 1.0.0
  contact:
    name: Lumo AI Team
    email: dev@lumo.ai

servers:
  - url: https://api.lumo.ai
    description: Production server
  - url: http://localhost:3000/api
    description: Development server

paths:
  /auth/signin/google:
    get:
      summary: Initiate Google OAuth login
      description: Redirects user to Google OAuth consent screen
      tags:
        - Authentication
      responses:
        '302':
          description: Redirect to Google OAuth consent screen
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: Invalid request or OAuth configuration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/callback/google:
    get:
      summary: Handle Google OAuth callback
      description: Processes Google OAuth callback and creates/updates user session
      tags:
        - Authentication
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from Google
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: State parameter for CSRF protection
      responses:
        '302':
          description: Redirect to dashboard or error page
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: Invalid authorization code or state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/account/link:
    post:
      summary: Link Google account to existing user
      description: Links a Google account to an existing user profile
      tags:
        - Account Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                googleCode:
                  type: string
                  description: Authorization code from Google OAuth
                state:
                  type: string
                  description: State parameter for CSRF protection
              required:
                - googleCode
      responses:
        '200':
          description: Account successfully linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkResponse'
        '400':
          description: Invalid request or account already linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Account merge conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMergeResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/account/unlink:
    delete:
      summary: Unlink Google account from user
      description: Removes Google account association from user profile
      tags:
        - Account Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account successfully unlinked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Cannot unlink - no alternative authentication method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/session:
    get:
      summary: Get current session information
      description: Returns current user session and authentication status
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Unauthorized - invalid or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Logout current user
      description: Invalidates current session and logs out user
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized - invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        profileImage:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SessionResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        expires:
          type: string
          format: date-time
        isAuthenticated:
          type: boolean

    AccountLinkResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
        linkedAccount:
          type: object
          properties:
            provider:
              type: string
            providerAccountId:
              type: string
            linkedAt:
              type: string
              format: date-time

    AccountMergeResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        mergeRequired:
          type: boolean
        conflictingUser:
          type: object
          properties:
            email:
              type: string
              format: email
            name:
              type: string
            accountCreated:
              type: string
              format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
        details:
          type: object
          nullable: true

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
