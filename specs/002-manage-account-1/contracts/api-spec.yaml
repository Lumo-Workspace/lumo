openapi: 3.0.3
info:
  title: Account Management API
  description: API endpoints for user account management including profile updates and avatar uploads
  version: 1.0.0
  contact:
    name: Lumo AI Team
    url: https://github.com/cli-lumo/lumo

servers:
  - url: https://lumo.vercel.app/api
    description: Production server
  - url: http://localhost:3000/api
    description: Development server

security:
  - NextAuth: []

paths:
  /profile:
    get:
      summary: Get current user profile
      description: Retrieve the current authenticated user's profile information
      operationId: getProfile
      tags:
        - Profile
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update user profile
      description: Update the current user's display name and profile information
      operationId: updateProfile
      tags:
        - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profile/avatar:
    post:
      summary: Upload avatar image
      description: Upload and process a new avatar image for the current user
      operationId: uploadAvatar
      tags:
        - Avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Avatar image file (JPG, PNG, GIF, WebP, SVG, max 5MB)
      responses:
        '200':
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Remove avatar image
      description: Remove the current user's avatar image and revert to default
      operationId: removeAvatar
      tags:
        - Avatar
      responses:
        '200':
          description: Avatar removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profile/events:
    get:
      summary: Subscribe to profile updates
      description: Server-Sent Events stream for real-time profile updates
      operationId: subscribeProfileUpdates
      tags:
        - Real-time
      responses:
        '200':
          description: Event stream established
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    NextAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: NextAuth.js session token

  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: string
          description: User ID
        displayName:
          type: string
          nullable: true
          description: User's display name
          maxLength: 100
        avatarUrl:
          type: string
          nullable: true
          description: URL to user's avatar image
        avatarBlobId:
          type: string
          nullable: true
          description: Vercel Blob ID for avatar storage
        email:
          type: string
          nullable: true
          description: User's email address
        createdAt:
          type: string
          format: date-time
          description: Profile creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        - id
        - createdAt
        - updatedAt

    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
          description: New display name
          maxLength: 100
      additionalProperties: false

    AvatarUploadResponse:
      type: object
      properties:
        avatarUrl:
          type: string
          description: URL to the uploaded avatar image
        avatarBlobId:
          type: string
          description: Vercel Blob ID for the uploaded image
        metadata:
          type: object
          properties:
            originalSize:
              type: integer
              description: Original file size in bytes
            processedSize:
              type: integer
              description: Processed file size in bytes
            dimensions:
              type: object
              properties:
                width:
                  type: integer
                height:
                  type: integer
            format:
              type: string
              description: Image format (jpg, png, gif, webp, svg)
      required:
        - avatarUrl
        - avatarBlobId
        - metadata

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details
      required:
        - error

    ProfileUpdateEvent:
      type: object
      properties:
        type:
          type: string
          enum: [profile_updated]
          description: Event type
        userId:
          type: string
          description: ID of user whose profile was updated
        changes:
          type: object
          properties:
            displayName:
              type: string
              nullable: true
            avatarUrl:
              type: string
              nullable: true
          description: Fields that were updated
        timestamp:
          type: string
          format: date-time
          description: Update timestamp
      required:
        - type
        - userId
        - timestamp

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

tags:
  - name: Profile
    description: User profile management
  - name: Avatar
    description: Avatar image upload and management
  - name: Real-time
    description: Real-time update subscriptions
