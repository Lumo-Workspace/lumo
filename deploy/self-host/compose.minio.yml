# Optional overlay (LUM-1332): files in MinIO (S3-compatible) instead of the
# app's blob-data volume. Loaded through COMPOSE_FILE
# (scripts/self-host/setup.sh --with minio). Switching an instance between the
# two does not move its files (docs/privacy/uploaded-files.md).
services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: lumo
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes: [minio-data:/data]
    healthcheck:
      # The image has bash but no curl: probe the liveness endpoint over /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r s <&3 && [[ $$s == *" 200 "* ]]'
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the private bucket once (no public policy: every read goes
  # through Lumo's authenticated routes). Idempotent.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    environment:
      MC_HOST_lumo: http://lumo:${MINIO_ROOT_PASSWORD}@minio:9000
    command: ['mb', '--ignore-existing', 'lumo/${S3_BUCKET:-lumo}']
    depends_on:
      minio: { condition: service_healthy }
    restart: 'no'

  # The guard in docker-compose.yml's migrate command checks BLOB_STORAGE.
  migrate:
    environment:
      BLOB_STORAGE: s3

  app:
    environment:
      BLOB_STORAGE: s3
      S3_BUCKET: ${S3_BUCKET:-lumo}
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: lumo
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    depends_on:
      minio-init: { condition: service_completed_successfully }

volumes:
  minio-data:
